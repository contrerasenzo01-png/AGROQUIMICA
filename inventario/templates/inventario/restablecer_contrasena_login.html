{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restablecer contraseña</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f1f5f3;
            color: #1c2a23;
        }

        .contenedor {
            width: 400px;
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #0b311e;
        }

        .descripcion {
            text-align: center;
            margin-bottom: 25px;
            color: #555;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #0b311e;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #164d31;
        }

        .mensaje {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 6px;
            background-color: #dff0d8;
            color: #286528;
            font-size: 14px;
            text-align: center;
        }

        .error {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 6px;
            background-color: #f8d7da;
            color: #842029;
            font-size: 14px;
            text-align: center;
        }

        .volver {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #0b311e;
            text-decoration: none;
            font-size: 14px;
        }

        .volver:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Restablecer contraseña</h1>

        <p class="descripcion">
            Ingrese su correo electrónico para restablecer su contraseña.
        </p>

        {% if mensaje %}
            <div class="mensaje">
                {{ mensaje }}
            </div>
        {% endif %}

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="email">Correo electrónico</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Ingrese su correo"
                required
            >

            <button type="submit">
                Restablecer contraseña
            </button>
        </form>

        <a href="{% url 'login' %}" class="volver">
            Volver al inicio de sesión
        </a>

    </div>

</body>
</html>
