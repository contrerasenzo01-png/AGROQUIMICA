{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesión bloqueada - Agroquímica del Valle</title>
    <link rel="stylesheet" href="{% static 'inventario/css/confirmar.css' %}">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #2e7d32, #4caf50);
        }
    </style>
</head>
<body>

<div class="lck-overlay lck-visible" style="backdrop-filter:none;background:transparent;">
    <div class="lck-caja">
        <h3>Sesión bloqueada por inactividad</h3>
        <p>
            Pasaron más de 15 minutos sin actividad. Ingresá tu usuario y
            contraseña para volver exactamente donde estabas.
        </p>

        {% if error %}
            <div class="lck-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{% url 'bloqueo' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ siguiente }}">

            <div class="lck-campo">
                <label for="lckUsuario">Usuario</label>
                <input type="text" id="lckUsuario" name="usuario"
                       autocomplete="username" required autofocus>
            </div>

            <div class="lck-campo">
                <label for="lckPassword">Contraseña</label>
                <input type="password" id="lckPassword" name="password"
                       autocomplete="current-password" required>
            </div>

            <button type="submit" class="lck-btn">Continuar</button>
        </form>

        <a class="lck-link" href="{% url 'cerrar_sesion' %}">Cerrar sesión</a>
    </div>
</div>

<script>
    // Avisa a la próxima página que debe restaurar lo que estabas escribiendo.
    try { sessionStorage.setItem('av:restaurar', '1'); } catch (e) {}
</script>

</body>
</html>
