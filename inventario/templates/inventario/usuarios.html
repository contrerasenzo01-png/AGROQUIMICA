
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de usuarios</title>
</head>
<body>

    <h1>GESTIONAR USUARIOS</h1>

    <form>

        <label for="ID_usuario">ID_usuario:</label>
        <input type="number" id="ID_usuario" name="ID_usuario" readonly>
        <br><br>

        <label for="DNI">DNI:</label>
        <input type="number" id="DNI" name="DNI" required>
        <br><br>

        <label for="Apellido_usuario">Apellido_usuario:</label>
        <input type="text" id="Apellido_usuario"
               name="Apellido_usuario" required>
        <br><br>

        <label for="Nombre_usuario">Nombre_usuario:</label>
        <input type="text" id="Nombre_usuario"
               name="Nombre_usuario" required>
        <br><br>

        <label for="Correo_usuario">Correo_usuario:</label>
        <input type="email" id="Correo_usuario"
               name="Correo_usuario" required>
        <br><br>

        <label for="Usuario">Usuario:</label>
        <input type="text" id="Usuario" name="Usuario" readonly>
        <br><br>

        <label for="Contraseña">Contraseña:</label>
        <input type="password" id="Contraseña"
               name="Contraseña" readonly>
        <br><br>

        <label for="Estado_usuario">Estado_usuario:</label>
        <select id="Estado_usuario" name="Estado_usuario">
            <option value="1">Activo</option>
            <option value="0">Inactivo</option>
        </select>
        <br><br>

        <label for="Fecha_ultima_modificacion">
            Fecha_ultima_modificacion:
        </label>
        <input type="datetime-local"
               id="Fecha_ultima_modificacion"
               name="Fecha_ultima_modificacion" readonly>
        <br><br>

        <label for="Fecha_baja">Fecha_baja:</label>
        <input type="datetime-local"
               id="Fecha_baja"
               name="Fecha_baja" readonly>
        <br><br>

        <label for="Cambiar_contraseña">
            Cambiar_contraseña:
        </label>
        <input type="checkbox"
               id="Cambiar_contraseña"
               name="Cambiar_contraseña"
               checked disabled>
        <br><br>

        <button type="submit">Dar de alta</button>
        <button type="button">Modificar</button>
        <button type="button">Dar de baja</button>
        <button type="reset">Limpiar</button>

    </form>

    <hr>

    <h1>RESTABLECER CONTRASEÑA</h1>

    <form>

        <label for="ID_usuario_restablecer">ID_usuario:</label>
        <input type="number"
               id="ID_usuario_restablecer"
               name="ID_usuario"
               required>
        <br><br>

        <label for="Usuario_restablecer">Usuario:</label>
        <input type="text"
               id="Usuario_restablecer"
               name="Usuario"
               readonly>
        <br><br>

        <label for="Contraseña_nueva">Contraseña:</label>
        <input type="password"
               id="Contraseña_nueva"
               name="Contraseña"
               readonly>
        <br><br>

        <label for="Confirmar_contraseña">
            Confirmar_contraseña:
        </label>
        <input type="password"
               id="Confirmar_contraseña"
               name="Confirmar_contraseña"
               required>
        <br><br>

        <button type="submit">Restablecer contraseña</button>
        <button type="reset">Limpiar</button>

    </form>

</body>
</html>
