{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Restablecer contraseña</title>

    <link
        rel="stylesheet"
        href="{% static 'inventario/styles/usuarios.css' %}"
    >

</head>

<body>

    <main>

        <section class="formulario">

            <h1>
                Restablecer contraseña
            </h1>


            <!-- ID del usuario -->
            <div class="form-group">

                <label>
                    ID_Usuario
                </label>

                <input
                    type="text"
                    value="{{ usuario.ID_Usuario }}"
                    readonly
                >

            </div>


            <!-- Usuario -->
            <div class="form-group">

                <label>
                    Usuario
                </label>

                <input
                    type="text"
                    value="{{ usuario.Usuario }}"
                    readonly
                >

            </div>


            <form
                method="POST"
                action="{% url 'restablecer_contrasena' usuario.ID_Usuario %}"
            >

                {% csrf_token %}


                <!-- Nueva contraseña -->
                <div class="form-group">

                    <label for="nueva_contrasena">
                        Nueva contraseña
                    </label>

                    <input
                        type="password"
                        id="nueva_contrasena"
                        name="nueva_contrasena"
                        required
                        minlength="8"
                    >

                </div>


                <!-- Confirmar contraseña -->
                <div class="form-group">

                    <label for="confirmar_contrasena">
                        Confirmar contraseña
                    </label>

                    <input
                        type="password"
                        id="confirmar_contrasena"
                        name="confirmar_contrasena"
                        required
                        minlength="8"
                    >

                </div>


                <!-- Botones -->
                <div class="modal-actions">

                    <a
                        href="{% url 'gestion_usuarios' %}"
                        class="btn-cancelar"
                    >
                        Cancelar
                    </a>

                    <button
                        type="submit"
                        class="btn-guardar"
                    >
                        Guardar nueva contraseña
                    </button>

                </div>

            </form>

        </section>

    </main>

</body>

</html>
