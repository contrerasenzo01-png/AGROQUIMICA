<header class="topbar">
  <!-- Sección Izquierda: Botón Menú + Migas de Pan (Breadcrumbs) -->
  <div class="topbar-left">
    <button class="menu-toggle-btn" aria-label="Abrir menú">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    
    <nav class="breadcrumb" aria-label="Ruta de navegación">
      <span class="breadcrumb-item">Espacio de trabajo</span>
      <span class="breadcrumb-separator">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </span>
      <span class="breadcrumb-item active">Dashboard</span>
    </nav>
  </div>

  <!-- Sección Derecha: Fecha + Notificación + Perfil -->
  <div class="topbar-right">
    <div class="topbar-date">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      <span>4 de octubre de 2026</span>
    </div>

    <button class="topbar-icon-btn" aria-label="Notificaciones">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <!-- Indicador verde de notificación -->
      <span class="notification-badge"></span>
    </button>

    <div class="user-avatar" title="Perfil del usuario">
      AD
    </div>
  </div>
</header>
